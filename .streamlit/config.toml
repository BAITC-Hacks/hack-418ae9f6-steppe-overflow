[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Фирменный стиль Steppe Wind: тёмно-бирюзовый #0c4741 и зелёный #00b72b из логотипа
[theme]
base = "light"
primaryColor = "#12803f"            # кнопки и акценты (белый текст — контраст 5:1)
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ebf1f7"      # второй цвет бренда: выпадающие списки, поля ввода
textColor = "#0c2f2b"
linkColor = "#12803f"
borderColor = "#dce8e1"
baseRadius = "0.6rem"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap, Roboto, sans-serif"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap, Roboto, sans-serif"
headingFontWeights = [800, 700]
greenColor = "#12803f"
blueColor = "#0c6b62"

[theme.sidebar]
backgroundColor = "#ebf1f7"
