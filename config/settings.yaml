# Общие настройки проекта. Все пути — относительно корня репозитория.

site:
  name: "ВЭС (2 турбины)"
  # Центр ВЭС — используется для запросов погоды
  latitude: 43.6442
  longitude: 78.5372
  turbines:
    t1: {latitude: 43.643198, longitude: 78.538828}
    t2: {latitude: 43.645150, longitude: 78.535604}

scada:
  files:
    t1: "Dataset/Dataset HackAlemAI для участников 11.03.2023-28.02.2026 - turbine 1.csv"
    t2: "Dataset/Dataset HackAlemAI для участников 11.03.2023-28.02.2026 - turbine 2.csv"
  # Метки времени в данных — UTC+6 (проверено сопоставлением с реанализом ERA5)
  utc_offset_hours: 6
  # Час считается валидным, если в нём не меньше стольких 10-минутных записей
  min_obs_per_hour: 4
  qc:
    # Простой: ветер выше порога, а мощность на минимуме
    downtime_ws_min: 5.0
    downtime_p_max: 0.01
    # Ограничение мощности: плато одинаковой мощности не короче N записей при ветре выше порога
    curtail_min_run: 6
    curtail_ws_min: 5.0
    curtail_p_min: 0.02
    curtail_p_max: 0.95

forecast:
  # Локальное время выпуска прогноза (в часовом поясе данных, UTC+6)
  issue_hour_local: 14
  # Прогноз на D+1 00:00 … D+2 23:00 (локальное время)
  horizon_days: 2
  test_first_issue: "2026-01-31"
  test_last_issue: "2026-02-27"

weather:
  cache_dir: "cache/weather"
  # Переменные, которые запрашиваются у всех источников
  variables:
    - wind_speed_10m
    - wind_speed_100m
    - wind_direction_10m
    - wind_direction_100m
    - wind_gusts_10m
    - temperature_2m
    - surface_pressure
    - relative_humidity_2m
  # Open-Meteo Single Runs API: конкретный прогон с известным временем старта.
  # Проверено: для этой точки реально доступен только ecmwf_ifs (архив с ~15.03.2024).
  single_runs:
    ecmwf_ifs:
      run_hours: [0, 6, 12, 18]
      publish_lag_h: 7        # консервативно: прогон доступен через 7 ч после старта
      forecast_hours: 72
      extra_variables: [wind_speed_120m, boundary_layer_height, cape]
  # Open-Meteo Previous Runs API: значения *_previous_dayN.
  # Проверено сопоставлением с прогонами ECMWF: previous_dayN для часа V берётся из
  # прогона с заблаговременностью 24N…24N+5 ч, т.е. run ≈ floor6(V) − 24N ч.
  previous_runs:
    ecmwf_ifs025: {publish_lag_h: 7}
    gfs_seamless: {publish_lag_h: 5}
    icon_seamless: {publish_lag_h: 4}
  previous_days: [1, 2, 3]
  # С какой даты качаем архив прогнозов
  archive_start: "2024-03-15"
  archive_end: "2026-03-01"

# Короткие имена моделей погоды — префиксы колонок признаков
nwp_prefix:
  ecmwf_ifs: ifs
  ecmwf_ifs025: ifs025
  gfs_seamless: gfs
  icon_seamless: icon

# Контрольные периоды: протокол как у теста (выпуск ежедневно, 48 ч вперёд).
# Модель обучается только на данных до первого выпуска периода.
validation:
  feb2025: {first_issue: "2025-01-31", last_issue: "2025-02-27"}
  dec2025: {first_issue: "2025-11-30", last_issue: "2025-12-30"}
  jan2026: {first_issue: "2025-12-31", last_issue: "2026-01-29"}
