# Продакшен на сервере: приложение + Caddy (HTTPS с автоматическим сертификатом Let's Encrypt).
#   docker compose up -d --build
# Домен задаётся переменной DOMAIN (по умолчанию steppewind.energy).
services:
  app:
    build: .
    image: steppewind:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "false"
    volumes:
      - runtime:/data/runtime
    expose:
      - "8501"

  # Планировщик агента: каждые 15 минут проверяет новые прогоны погоды и пересчитывает живой прогноз
  scheduler:
    image: steppewind:latest
    depends_on:
      - app
    restart: unless-stopped
    command: ["python", "-m", "windagent", "live", "--watch", "--interval", "900"]
    env_file:
      - path: .env
        required: false
    volumes:
      - runtime:/data/runtime

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-steppewind.energy}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/pwa:/srv/pwa:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  runtime:
  caddy_data:
  caddy_config:
