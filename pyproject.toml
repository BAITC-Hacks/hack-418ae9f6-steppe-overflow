[project]
name = "windagent"
version = "0.1.0"
description = "Agentic AI прогноз почасовой выработки ВЭС на 24–48 часов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
windagent = "windagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: тесты, которым нужен интернет (по умолчанию пропускаются)",
]
addopts = "-m 'not network'"
